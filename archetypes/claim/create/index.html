<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="color-scheme" content="light"/><title>Create RopeBridge Claim</title><link rel="stylesheet" href="../../../assets/css/ropebridge/tokens.css"/><link rel="stylesheet" href="../../../assets/css/ropebridge/base.css"/><link rel="stylesheet" href="../../../assets/css/ropebridge/components.css"/><link rel="stylesheet" href="../../../assets/css/ropebridge/states.css"/><style>.rb-editable{border-radius:10px;cursor:text;outline:1px dashed rgba(95,112,68,.28);outline-offset:5px}.rb-editable:focus{outline:2px solid rgba(95,112,68,.62);background:rgba(255,250,242,.72)}.rb-editable:empty::before{content:attr(data-placeholder);color:rgba(63,63,59,.38);pointer-events:none}.rb-upload-target{position:relative;cursor:pointer}.rb-upload-target:focus-visible{outline:none;box-shadow:var(--rb-shadow-focus)}.rb-upload-target::after{content:"Tap to upload image";position:absolute;right:12px;bottom:12px;border-radius:999px;background:rgba(255,253,248,.88);color:rgba(20,36,22,.72);padding:7px 10px;font-size:12px;font-weight:700;letter-spacing:.02em;box-shadow:0 6px 18px rgba(43,35,22,.12)}.rb-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.rb-output-card{margin-top:18px;padding:18px;text-align:center}.rb-output-actions{display:grid;gap:10px;margin-top:14px}.rb-output-link{display:inline-grid}.rb-qr-box{display:grid;place-items:center;margin:14px auto 0;padding:14px;width:min(100%,240px);border-radius:18px;background:#fff}.rb-small-button{min-height:48px;border-radius:15px;font-size:16px}.rb-inline-preview-card{display:none;margin-top:18px;padding:12px;overflow:hidden}.rb-inline-preview-card.is-visible{display:block}.rb-inline-preview-frame{display:block;width:100%;height:740px;border:0;border-radius:20px;background:var(--rb-bg)}</style></head><body><main class="rb-flow-page"><div class="rb-flow-shell"><section class="rb-screen-state is-active" aria-labelledby="offer-title"><header class="rb-claim-header"><div class="rb-claim-heading"><p class="rb-recognition-banner is-visible">Tap the sample page text and fill in the blanks. The preview link and QR update immediately.</p><h1 id="vendor-name" class="rb-claim-vendor rb-editable" contenteditable="true" data-placeholder="Business name"></h1></div><div class="rb-corner-seal" aria-hidden="true"></div></header><section class="rb-card rb-flow-card rb-offer-card"><button id="image-upload-button" class="rb-image-container rb-upload-target" type="button" aria-label="Upload offer image"><img id="offer-image" src="../../../assets/images/claim-image-arriving-soon.svg" alt="Your image is arriving shortly"/></button><input id="image-upload" class="rb-visually-hidden" type="file" accept="image/*"/><div class="rb-offer-copy"><h1 id="offer-title" class="rb-offer-title rb-editable" contenteditable="true" data-field="title" data-placeholder="Sample name"></h1><p class="rb-offer-description rb-editable" contenteditable="true" data-field="description" data-placeholder="Short description"></p></div><button id="cta-preview" class="rb-button rb-editable" type="button" contenteditable="true" data-field="cta" data-placeholder="Claim sample"></button><p class="rb-limit-note" data-field="limitNote">One claim per person, per day.</p></section><section class="rb-card rb-output-card" aria-labelledby="output-title"><p id="output-title" class="rb-section-label">Scan to preview</p><div id="qr-code" class="rb-qr-box" aria-label="QR code for generated claim page"></div><div class="rb-output-actions"><button id="preview-toggle" class="rb-button rb-small-button" type="button" aria-expanded="false" aria-controls="inline-preview-card">Preview page</button><button id="copy-link" class="rb-button rb-small-button" type="button">Copy link + Download QR code</button></div><a id="preview-link" class="rb-output-link" href="#" target="_blank" rel="noreferrer">Open full page</a><p id="copy-status" class="rb-status" role="status" aria-live="polite"></p></section><section id="inline-preview-card" class="rb-card rb-inline-preview-card" aria-label="Live page preview"><iframe id="inline-preview" class="rb-inline-preview-frame" title="Claim page preview"></iframe></section><p class="rb-powered-by">powered by RopeBridge</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="./create.js?v=short-links-2"></script></body></html>
