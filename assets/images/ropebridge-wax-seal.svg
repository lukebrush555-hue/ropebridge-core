      <stop offset="0.28" stop-color="#77814e"/>
      <stop offset="0.62" stop-color="#53612f"/>
      <stop offset="1" stop-color="#2f3d1d"/>
    </radialGradient>
    <radialGradient id="pressedGlow" cx="42%" cy="34%" r="70%">
