<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">RopeBridge wax seal</title>
  <desc id="desc">A muted olive wax seal with an irregular hand-poured edge and a pressed bridge mark.</desc>
  <defs>
